<!DOCTYPE html>
<html lang="en" class="wa-theme-default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Web Awesome × Scittle + Replicant — kitchen sink (78 components)</title>

  <!-- Web Awesome 3.15.0 (MIT), dist-cdn build: stylesheet + autoloader, no build step.
       Pinned versions: bump Web Awesome, Scittle and Font Awesome deliberately. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist-cdn/styles/webawesome.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist-cdn/webawesome.loader.js" data-webawesome="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist-cdn/"></script>
  <script type="module">
    // Font Awesome Free SVGs from jsdelivr instead of the default Font Awesome kit CDN.
    import { registerIconLibrary } from "https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.15.0/dist-cdn/webawesome.loader.js";
    registerIconLibrary("default", {
      resolver: (name) => `https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/svgs/solid/${name}.svg`,
      mutator: (svg) => svg.setAttribute("fill", "currentColor"),
    });
  </script>

  <style>
    body { margin: 0; font-family: var(--wa-font-family-body); background: var(--wa-color-surface-lowered); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.5rem; padding: 1.5rem; align-items: start; }
    header.top { padding: 1.5rem 1.5rem 0; }
    header.top h1 { margin: 0 0 .25rem; }
    .cat { margin: 2rem 0 .75rem; display: flex; align-items: baseline; gap: .75rem; }
    .cat h2 { margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    .tile { background: var(--wa-color-surface-default); border: 1px solid var(--wa-color-surface-border); border-radius: 12px; padding: 1rem; min-width: 0; }
    .tile.wide { grid-column: 1 / -1; }
    .tile h3 { margin: 0 0 .75rem; font: 600 13px/1.3 var(--wa-font-family-code); color: var(--wa-color-text-quiet); }
    .tile h3 .exp { color: var(--wa-color-warning-on-quiet); font-weight: 400; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .stack > * + * { margin-top: .75rem; }
    .muted { color: var(--wa-color-text-quiet); font-size: 13px; }
    /* Right column: sticky and exactly one viewport high; log and state share it and scroll independently */
    .side { position: sticky; top: 1rem; height: calc(100vh - 2rem); display: flex; flex-direction: column; min-height: 0; }
    .side h3 { flex: none; }
    .side .log { flex: 2 1 0; min-height: 0; overflow-y: auto; }
    .side .state { flex: 3 1 0; min-height: 0; overflow-y: auto; position: relative; }
    .log { font: 12px/1.5 var(--wa-font-family-code); background: #111; color: #9ef09e; border-radius: 10px; padding: .75rem; white-space: pre-wrap; }
    .state { font: 11px/1.45 var(--wa-font-family-code); background: var(--wa-color-surface-default); border: 1px solid var(--wa-color-surface-border); border-radius: 10px; padding: .75rem; white-space: pre-wrap; word-break: break-word; }
    .state .kv { padding: 1px 4px; border-radius: 4px; transition: background-color .6s ease-out; }
    .state .kv.changed { background: #fff3a3; transition: none; }
    .state .k { color: var(--wa-color-brand-on-quiet); font-weight: 600; }
    .events-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    pre.code { font: 12px/1.45 var(--wa-font-family-code); background: var(--wa-color-surface-lowered); border-radius: 6px; padding: .5rem .65rem; margin: 0; white-space: pre-wrap; word-break: break-word; }
    ul.pros { margin: 0; padding-left: 1.2rem; font-size: 14px; }
    li.pro::marker { content: "+  "; color: var(--wa-color-success-on-quiet); font-weight: 700; }
    li.con::marker { content: "–  "; color: var(--wa-color-danger-on-quiet); font-weight: 700; }
    @media (max-width: 1100px) { .events-grid { grid-template-columns: 1fr; } }
    .box { width: 56px; height: 56px; border-radius: 10px; background: var(--wa-color-brand-fill-loud); }
    .io-root { height: 150px; overflow: auto; border: 1px dashed var(--wa-color-surface-border); border-radius: 8px; padding: .5rem; }
    .io-target { padding: 1rem; border-radius: 8px; background: var(--wa-color-neutral-fill-quiet); transition: background .3s; }
    .io-target.visible { background: var(--wa-color-success-fill-loud); color: white; }
    .resizable { resize: both; overflow: auto; width: 220px; height: 90px; min-width: 120px; min-height: 60px; border: 2px dashed var(--wa-color-brand-border-loud); border-radius: 8px; display: grid; place-items: center; }
    .popup-anchor { display: inline-block; width: 120px; height: 44px; border: 2px dashed var(--wa-color-neutral-border-loud); border-radius: 8px; }
    .popup-box { background: var(--wa-color-brand-fill-loud); color: white; padding: .4rem .7rem; border-radius: 6px; font-size: 13px; }
    .split-pane { height: 140px; display: grid; place-items: center; background: var(--wa-color-surface-lowered); }
    wa-carousel { --aspect-ratio: 3/2; }
    wa-carousel img, wa-comparison img, .lb-thumbs img { width: 100%; display: block; }
    .lb-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    .lb-thumbs img { border-radius: 6px; cursor: zoom-in; }
    wa-scroller table { border-collapse: collapse; white-space: nowrap; font-size: 13px; }
    wa-scroller td, wa-scroller th { border: 1px solid var(--wa-color-surface-border); padding: .35rem .6rem; text-align: left; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { position: static; height: auto; } .side .log, .side .state { flex: none; height: 260px; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.replicant.js"></script>
</head>
<body>
<header class="top">
  <h1>Web Awesome × Scittle + Replicant</h1>
  <div class="muted">All 78 free components (Web Awesome 3.15.0, MIT), rendered from ClojureScript hiccup by Replicant, evaluated in the browser by Scittle. No build step. Every interaction goes through one atom; the log on the right shows each Replicant <code>:on</code> handler firing.</div>
</header>
<div id="app"></div>

<!-- Static variant: same UI file as index.html, loaded from any static host (no bb server needed).
     KS_MODE "static" switches off the API, websocket and hot reload. -->
<script>window.KS_MODE = "static";</script>
<script type="application/x-scittle" src="cljs/kitchen_sink.cljs"></script>
</body>
</html>
