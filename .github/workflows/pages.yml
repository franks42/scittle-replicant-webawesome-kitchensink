# Publishes the generated single-file demo (single-file/index.html) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Run `bb build-single` and commit before pushing app/ changes.
name: Deploy single-file demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["single-file/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: single-file
      - id: deployment
        uses: actions/deploy-pages@v4
